[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkernel"
version = "0.1.0"
description = "A durable, replayable, policy-governed runtime for LLM agents: crash recovery, human approvals that survive restarts, taint-aware security policy, deterministic replay, and an offline red-team harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
agentkernel = "agentkernel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
